name: Daily auction digest

on:
  schedule:
    - cron: "17 14 * * *"         # ~6:17 AM Pacific: full update + email (off the top of the hour, when GitHub drops scheduled runs)
    - cron: "17 15-23,0-6 * * *"  # hourly at :17 until 10 PM Pacific: refresh bids on the site
  workflow_dispatch:         # run it any time from the Actions tab (also used by the hourly kick in extras/shared-notes.gs)
    inputs:
      email:
        description: "Send the email digest too? (yes/no)"
        default: "no"

permissions:
  contents: write            # to commit data/ and docs/ back to the repo

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Tests
        run: python -m pytest -q

      - name: Scrape and build digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_SEND: ${{ github.event.schedule == '17 14 * * *' || inputs.email == 'yes' }}
        run: python -m tracker

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: docs/index.html
          if-no-files-found: ignore

      - name: Commit results
        run: |
          git config user.name "auction-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Digest $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet && git push
